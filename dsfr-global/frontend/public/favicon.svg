<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="DSFR Global">
  <!-- Solid tile: outline marks turn to mush at 16px, a filled shape stays legible. -->
  <rect width="32" height="32" rx="8" fill="#6366f1"/>
  <!-- Meridian arc: the "global" half of the idea, kept as a single quiet stroke. -->
  <path d="M16 5.5c-3.6 3.1-3.6 17.9 0 21" stroke="#ffffff" stroke-opacity=".45"
        stroke-width="1.6" fill="none" stroke-linecap="round"/>
  <path d="M16 5.5c3.6 3.1 3.6 17.9 0 21" stroke="#ffffff" stroke-opacity=".45"
        stroke-width="1.6" fill="none" stroke-linecap="round"/>
  <!-- Ascent line: career growth, drawn boldest so it survives at tab size. -->
  <path d="M7.5 21.5 13 15.5l3.6 3.4L24.5 10" stroke="#ffffff" stroke-width="3"
        fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M19.8 10h4.7v4.7" stroke="#ffffff" stroke-width="3" fill="none"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
